// Fungsi untuk mendapatkan nilai CPU berdasarkan storage
function getCPUValue(storageValue) {
  const storageMap = {
    "1024": 120,    // 1GB = 120% CPU
    "2048": 140,    // 2GB = 140% CPU
    "3072": 160,    // 3GB = 160% CPU
    "4096": 180,    // 4GB = 180% CPU
    "5120": 200,    // 5GB = 200% CPU
    "6144": 220,    // 6GB = 220% CPU
    "7168": 240,    // 7GB = 240% CPU
    "8192": 260,    // 8GB = 260% CPU
    "9216": 280,    // 9GB = 280% CPU
    "10240": 300,   // 10GB = 300% CPU
    "0": 0          // UNLIMITED = 0% CPU
  };
  
  return storageMap[storageValue] || 0; // Default 100% jika tidak ditemukan
}

function checkAutoLogout() {
  const lastLogin = parseInt(localStorage.getItem(LOGIN_TIMESTAMP_KEY)||"0");
  const now = Date.now();
  if(lastLogin && (now - lastLogin) >= LOGOUT_INTERVAL){
    alert("Sesi sudah lebih dari 24 jam. Silakan login ulang.");
    logout();
  }
}

checkAutoLogout();

if(localStorage.getItem(LOGIN_KEY)==="true"){
  loginGate.classList.add("hidden");
  step1.classList.remove("hidden");
  
  if(!localStorage.getItem(LOGIN_TIMESTAMP_KEY)){
    localStorage.setItem(LOGIN_TIMESTAMP_KEY, Date.now());
  }
}

async function getGithubUsers(){
  const res = await fetch(
    `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
    { headers:{ Authorization:`Bearer ${GITHUB_TOKEN}` } }
  );
  const data = await res.json();
  return JSON.parse(atob(data.content));
}

async function checkLogin(){
  try{
    const users = await getGithubUsers();
    const u = loginUser.value.trim();
    const p = loginPass.value.trim();
    const ok = users.find(x=>x.username===u && x.password===p);
    if(!ok) return alert("Login salah");

    localStorage.setItem(LOGIN_KEY,"true");
    localStorage.setItem(LOGIN_TIMESTAMP_KEY, Date.now()); 
    
    loginGate.classList.add("hidden");
    step1.classList.remove("hidden");
  }catch(e){alert("Gagal ambil user")}
}

function logout(){
  localStorage.removeItem(LOGIN_KEY);
  localStorage.removeItem(LOGIN_TIMESTAMP_KEY);
  location.reload();
}

async function buatPanel(){
  if(!username.value||!paket.value) return alert("Lengkapi data");
  step1.classList.add("hidden");
  loadingStep.classList.remove("hidden");

  try{
    const u=username.value.toLowerCase();
    const storageValue = paket.value;
    const cpuValue = getCPUValue(storageValue);
    
    const r=await fetch(
      `https://api.resellergaming.my.id/pterodactyl/addpanel?domain=${DOMAIN}&plta=${PLTA}&username=${u}&ram=${storageValue}&disk=${storageValue}&cpu=${cpuValue}`
    );
    const d=await r.json();
    if(!d.user) throw 0;

    loadingStep.classList.add("hidden");
    step2.classList.remove("hidden");

    email.textContent=d.user.attributes.email;
    uname.textContent=u;
    pass.textContent=u;
    ram.textContent=storageValue==0?"UNLIMITED":(storageValue/1024)+" GB";
    cpu.textContent=cpuValue==0?"0%" : cpuValue + "%";
  }catch{
    alert("Gagal create panel");
    location.reload();
  }
}
